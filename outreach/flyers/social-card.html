<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LT4CPR Social Card</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 675px;
      overflow: hidden;
      border-radius: 12px;
    }

    .bg {
      position: absolute;
      inset: 0;
      background: url('../../img/venue.webp') center 60% / cover no-repeat;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(27, 42, 69, 0.50) 0%,
        rgba(27, 42, 69, 0.35) 60%,
        rgba(27, 42, 69, 0.20) 100%
      );
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 52px 60px;
      color: #fff;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #fff;
      background: #c95420;
      padding: 5px 14px;
      border-radius: 4px;
    }

    .conference {
      font-size: 22px;
      font-weight: 600;
      opacity: 0.85;
      letter-spacing: 0.04em;
    }

    .middle {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .workshop-name {
      font-size: 100px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
    }

    .workshop-full {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
      max-width: 820px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 26px;
      font-weight: 500;
      opacity: 0.9;
    }

    .meta-item .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c95420;
      flex-shrink: 0;
    }

    .url {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.6;
      letter-spacing: 0.03em;
    }

    .accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: #c95420;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="overlay"></div>
    <div class="content">

      <div class="top">
        <span class="badge">Workshop</span>
        <span class="conference">AACL-IJCNLP 2026</span>
      </div>

      <div class="middle">
        <div class="workshop-name">LT4CPR</div>
        <div class="workshop-full">Language Technologies for Crisis Preparedness and Response</div>
      </div>

      <div class="bottom">
        <div class="meta">
          <div class="meta-item"><span class="dot"></span>November 9, 2026</div>
          <div class="meta-item"><span class="dot"></span>Hengqin, Zhuhai, China</div>
          <div class="meta-item"><span class="dot"></span>Submissions open until August 2026</div>
        </div>
      </div>

    </div>
    <div class="accent-bar"></div>
  </div>
</body>
</html>
